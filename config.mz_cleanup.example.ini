; ==========================================================================
; Exemple de configuration INI pour l'outil mz_cleanup
;
;     python -m mz_cleanup --config config.mz_cleanup.ini
;
; Sections :
;   [general]     parametres globaux
;   [logging]     journalisation
;   [ssh:mz1]     connexion SSH vers MZ1     (enabled=false => acces local)
;   [ssh:backup]  connexion SSH vers BACKUP-MZ
;   [pair:NOM]    un couple de repertoires (autant de sections que necessaire)
; ==========================================================================

[general]
dry_run = true
force = false
workers = 8
date_pattern = \d{8}
date_format = %Y%m%d

[logging]
level = DEBUG
console_level = INFO
file = mz_cleanup.log

[ssh:mz1]
enabled = false
host = mz1.exemple.local
port = 22
user = mzadmin
key_file = ~/.ssh/id_rsa
timeout = 30

[ssh:backup]
enabled = false
host = backup-mz.exemple.local
port = 22
user = mzadmin
key_file = ~/.ssh/id_rsa
timeout = 30

[pair:EC6/forw/GGSN/01]
mz1 = /mzarchives/EC6/forw/GGSN/01/MACH
backup = /BACKUP-MZ1/mzarchives/EC6/GGSN/01
