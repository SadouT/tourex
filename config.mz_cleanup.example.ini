; ==========================================================================
; Exemple de configuration INI pour l'outil mz_cleanup
;
;     python -m mz_cleanup --config config.mz_cleanup.ini
;
; Sections :
;   [general]     parametres globaux
;   [logging]     journalisation
;   [ssh:mz1]     connexion SSH vers MZ1     (enabled=false => acces local)
;   [ssh:backup]  connexion SSH vers BACKUP-MZ
;   [pair:NOM]    un couple de repertoires (autant de sections que necessaire)
; ==========================================================================

[general]
dry_run = true
force = false
workers = 8
date_pattern = \d{8}
date_format = %Y%m%d

[logging]
level = DEBUG
console_level = INFO
file = mz_cleanup.log

; Authentification par mot de passe.
; (Astuce securite : restreignez les droits du fichier avec `chmod 600`.)
[ssh:mz1]
enabled = false
host = mz1.exemple.local
port = 22
user = mzadmin
password = motdepasse_mz1
timeout = 30

[ssh:backup]
enabled = false
host = backup-mz.exemple.local
port = 22
user = mzadmin
password = motdepasse_backup
timeout = 30

; Liste des couples de repertoires (GGSN/01, 02, 03, ...).
[pair:EC6/forw/GGSN/01]
mz1 = /mzarchives/EC6/forw/GGSN/01/MACH
backup = /BACKUP-MZ1/mzarchives/EC6/GGSN/01

[pair:EC6/forw/GGSN/02]
mz1 = /mzarchives/EC6/forw/GGSN/02/MACH
backup = /BACKUP-MZ1/mzarchives/EC6/GGSN/02

[pair:EC6/forw/GGSN/03]
mz1 = /mzarchives/EC6/forw/GGSN/03/MACH
backup = /BACKUP-MZ1/mzarchives/EC6/GGSN/03

[pair:EC6/forw/GGSN/04]
mz1 = /mzarchives/EC6/forw/GGSN/04/MACH
backup = /BACKUP-MZ1/mzarchives/EC6/GGSN/04

[pair:EC6/forw/GGSN/05]
mz1 = /mzarchives/EC6/forw/GGSN/05/MACH
backup = /BACKUP-MZ1/mzarchives/EC6/GGSN/05
